<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outils de gestion et de planification des dépendances vertes</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1a1a; --muted:#5f6478; --card:rgba(255,255,255,.94); --line:#7a7f94;
  --accent:#4a8a2a; --accent-dark:#386b1f; --err:#b3261e;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:90px}
body{margin:0;color:var(--ink);font:17px/1.5 var(--sans);min-height:100vh;
  /* Photo de fond : assets/fond.jpg ; le dégradé sert de secours */
  background:
    url("assets/fond.jpg") 35% center/cover fixed no-repeat,
    linear-gradient(180deg,#8fa3b8 0%,#d9a98c 38%,#8a7a52 62%,#5f6b3a 100%) fixed;
}
header{background:#fff;height:100px;display:flex;align-items:center;padding:0 clamp(16px,4vw,56px);
  box-shadow:0 1px 6px rgba(0,0,0,.15)}
header img{height:76px;width:auto;display:block}
header .fallback{font:600 1.8rem var(--sans);color:#444}
.progress{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.9);height:26px;
  display:flex;align-items:center}
.progress .track{flex:1;height:8px;margin:0 12px;background:#dde3d8;border-radius:4px;overflow:hidden}
.progress .fill{height:100%;width:0;background:var(--accent);transition:width .25s}
.progress span{font-size:12px;color:var(--muted);padding-right:12px;white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:22px clamp(10px,3vw,24px) 70px}
.card{background:var(--card);border-radius:10px;padding:20px 24px;margin:0 0 14px;
  box-shadow:0 2px 10px rgba(0,0,0,.12)}
h1{font:700 clamp(1.7rem,4.6vw,2.7rem)/1.18 var(--serif);margin:0;color:#14213d}
.card p{margin:0 0 12px}.card p:last-child{margin-bottom:0}
.count{display:inline-block;font:600 1rem var(--sans);color:#222;background:var(--card);padding:6px 14px;border-radius:20px;margin:6px 0 16px}
h2.group{font:700 clamp(1.3rem,3.4vw,1.8rem)/1.25 var(--serif);margin:0;color:#14213d}
.group-desc{color:var(--muted)}

fieldset{border:0;margin:0 0 14px;padding:18px 24px 14px;min-width:0;background:var(--card);
  border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.12);position:relative}
fieldset.err{outline:2px solid var(--err)}
.req{font-size:.92rem;display:block;margin-bottom:2px}
.req b{font-size:1.15rem;margin-right:5px}
legend{float:left;width:100%;padding:0;margin:0 0 8px;font:600 1.3rem/1.3 var(--sans)}
legend+*{clear:both}
.hint{font-weight:400;font-size:1rem;margin:0 0 10px;color:var(--ink)}
.instr{font-style:italic;font-size:.95rem;margin:0 0 12px}
figure{margin:6px 0 14px}
figure img{max-width:100%;height:auto;border-radius:6px;display:block;margin:0 auto}
figcaption{font-size:.88rem;color:var(--muted);text-align:center;margin-top:6px}
.opts{display:grid;gap:4px}
.opt{display:flex;gap:12px;align-items:center;padding:10px 4px;cursor:pointer;
  font-weight:500;color:var(--muted);font-size:1.1rem;line-height:1.35}
.opt:hover{color:var(--ink)}
.opt:has(input:checked){color:var(--ink)}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed}
.opt input{appearance:none;-webkit-appearance:none;margin:0;flex:none;width:24px;height:24px;
  border:2px solid var(--line);background:#fff;display:grid;place-content:center;cursor:inherit}
.opt input[type=radio]{border-radius:50%}
.opt input[type=checkbox]{border-radius:5px}
.opt input::after{content:"";width:14px;height:14px;transform:scale(0);transition:transform .1s;background:var(--accent)}
.opt input[type=radio]::after{border-radius:50%}
.opt input[type=checkbox]::after{border-radius:2px}
.opt input:checked{border-color:var(--accent);border-width:3px}
.opt input:checked::after{transform:scale(1)}
.opt input:focus-visible{outline:3px solid #9ec58a;outline-offset:2px}
.other-wrap{display:flex;flex-direction:column;align-items:stretch;gap:8px;flex:1;min-width:0}
.opt:has(.other-wrap){align-items:flex-start}
.opt:has(.other-wrap) input[type=radio],.opt:has(.other-wrap) input[type=checkbox]{margin-top:2px}
input[type=text],textarea{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);
  border-radius:6px;padding:8px 10px;width:100%}
textarea.other-txt{width:100%;min-height:84px;padding:12px 14px;font-size:1.05rem;font-weight:400;color:var(--ink);resize:vertical}
.other-txt.hidden{display:none}
textarea{min-height:130px;resize:vertical}
input[type=text]:focus,textarea:focus{outline:3px solid #9ec58a;outline-offset:1px;border-color:var(--accent)}
.msg{color:var(--err);font-size:.92rem;margin:8px 0 0;display:none}
fieldset.err .msg{display:block}
.hidden{display:none!important}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}

.nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
button{font:600 1rem var(--sans);background:var(--accent);color:#fff;border:0;border-radius:6px;
  padding:13px 28px;cursor:pointer;min-height:48px}
button:hover{background:var(--accent-dark)}
button.sec{background:#fff;color:var(--accent-dark);border:2px solid var(--accent)}
button:disabled{opacity:.6;cursor:wait}
#status{margin:12px 4px 0;color:#fff;background:var(--err);padding:0;border-radius:6px;font-weight:600}
#status:not(:empty){padding:10px 14px}
.thanks{text-align:center;padding:40px 24px}
.thanks h2{font:700 1.8rem var(--serif);margin:0 0 10px}
@media (max-width:600px){
  header{height:78px}header img{height:58px}
  .card,fieldset{padding:16px}
  legend{font-size:1.15rem}
}
</style>
</head>
<body>
<header>
  <img src="assets/logo.png" alt="SAGID+" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fallback',textContent:'SAGID+'}))">
</header>
<div class="progress" aria-hidden="true"><div class="track"><div class="fill" id="fill"></div></div><span id="count"></span></div>
<main id="app">
  <div class="card"><h1 id="title"></h1></div>
  <div class="card" id="intro"></div>
  <p class="count" id="nq"></p>
  <form id="form" novalidate></form>
</main>

<script src="config.js"></script>
<script>
const DATA = {"title":"Outils de gestion et de planification des dépendances vertes","introHtml":["Dans le cadre du projet <strong>SAGID+</strong> (Université de Lorraine), nous travaillons sur des solutions cartographiques pour faciliter la gestion et la planification des dépendances vertes (bords de route).","Ce questionnaire — <strong>26 questions, environ 10 minutes</strong> — vise à recueillir vos pratiques et vos besoins, afin de proposer des solutions réellement utiles à votre travail quotidien. Il n'y a pas de bonne ou de mauvaise réponse : c'est votre réalité de terrain qui nous intéresse.","Vos réponses sont <strong>anonymes</strong>. Merci pour le temps que vous nous accordez."],"consigne":"Sauf mention « plusieurs réponses possibles », cochez une seule réponse par question.","groups":[{"title":"Votre profil","questions":[{"n":1,"col":"q01_fonction","type":"single","req":true,"label":"Quelle est votre fonction ?","options":["Responsable ou chef de service","Chef d'agence / chef de centre","Chef d'équipe","Agent d'exploitation ou de terrain","Technicien ou bureau d'études"],"other":true},{"n":2,"col":"q02_structure","type":"single","req":true,"label":"Dans quel type de structure travaillez-vous ?","options":["Conseil départemental","Commune ou intercommunalité","Direction interdépartementale des routes (DIR)","Concessionnaire autoroutier","Entreprise prestataire"],"other":true},{"n":3,"col":"q03_lineaire","type":"single","req":true,"label":"Quel linéaire de routes gérez-vous ?","hint":"La longueur totale de routes dont vous avez la charge, en kilomètres. Une estimation suffit.","options":["Moins de 50 km","50 à 500 km","500 à 1 500 km","Plus de 1 500 km","Je ne sais pas"]},{"n":4,"col":"q04_equipe","type":"single","req":true,"label":"Combien de personnes avez-vous sous votre responsabilité ?","hint":"Agents, techniciens ou autres personnes que vous encadrez, directement ou non.","options":["Aucune","1 à 3","4 à 10","11 à 30","Plus de 30"]},{"n":5,"col":"q05_anciennete","type":"single","req":true,"label":"Depuis combien de temps occupez-vous ce type de poste ?","options":["Moins de 2 ans","2 à 5 ans","6 à 15 ans","Plus de 15 ans"]}]},{"title":"Vos pratiques actuelles","questions":[{"n":6,"col":"q06_supports_preparation","type":"multi","req":true,"label":"Aujourd'hui, quel(s) support(s) utilisez-vous pour préparer la planification des chantiers ?","hint":"Planification des chantiers : priorisation des secteurs, dates d'intervention, répartition des ressources humaines et matérielles, type d'intervention (fauchage, élagage, curage, etc.).","options":["Selon l'expérience","Sur carte papier","Sur tableau Excel ou papier","Avec un logiciel dédié","Avec une carte numérique (en ligne)"],"other":true},{"n":7,"col":"q07_supports_preparation_precisions","type":"textarea","req":false,"label":"Expliquez en quelques mots comment chacun des supports est utilisé. (facultatif)"},{"n":8,"col":"q08_frequence","type":"single","req":true,"label":"À quelle fréquence planifiez-vous ?","hint":"À quel rythme vous décidez des interventions à venir.","options":["En continu","Chaque semaine","Chaque mois","Par saison (fauchage, débroussaillage)","Une fois par an"],"other":true},{"n":9,"col":"q09_validation","type":"single","req":true,"label":"Qui valide la planification des interventions ?","hint":"La personne ou l'instance qui valide la planification : ce qui sera fait, où et quand.","options":["Responsable ou chef de service","Chef d'agence / chef de centre","Chef d'équipe","Agent d'exploitation ou de terrain","Technicien ou bureau d'études","Décision collective en réunion","Planning annuel imposé"],"other":true},{"n":10,"col":"q10_supports_suivi","type":"multi","req":true,"label":"Quel(s) support(s) utilisez-vous pour assurer le suivi des chantiers ?","hint":"Comment vous savez ce qui a déjà été réalisé et ce qui reste à faire.","options":["De mémoire","Sur papier","Sur Excel","Dans un logiciel","Pas de suivi formalisé"],"other":true,"exclusive":"Pas de suivi formalisé"},{"n":11,"col":"q11_supports_suivi_precisions","type":"textarea","req":false,"label":"Expliquez en quelques mots comment chacun des supports est utilisé. (facultatif)"},{"n":12,"col":"q12_elements_compliques","type":"multi","req":true,"label":"Selon vous, quels sont les éléments les plus compliqués à prendre en compte dans la planification des chantiers ?","hint":"OLD : obligations légales de débroussaillement.","options":["Les caractéristiques du réseau","La disponibilité des ressources humaines","La disponibilité du matériel","Les contraintes réglementaires environnementales (espèces protégées)","Les OLD","La gestion spécifique des espèces invasives","L'avancement effectif des chantiers"],"other":true}]},{"title":"Vos outils","questions":[{"n":13,"col":"q13_outil_anciennete","type":"single","req":true,"label":"Si vous utilisez un outil de gestion / planification des chantiers, depuis combien de temps l'utilisez-vous ?","hint":"Un logiciel, une application ou un tableur que vous utilisez pour organiser et suivre vos chantiers.","options":["Plus de 3 ans","Entre 1 an et 3 ans","Moins de 1 an","En cours d'expérimentation","Prévu pour plus tard","Je n'utilise pas d'outil de ce type"]},{"n":14,"col":"q14_outil_nom","type":"text","req":false,"label":"Lequel ? (nom du logiciel ou de l'application)","showIf":{"q":13,"in":["Plus de 3 ans","Entre 1 an et 3 ans","Moins de 1 an","En cours d'expérimentation"]}},{"n":15,"col":"q15_fonctions_utilisees","type":"multi","req":false,"label":"Quelles fonctions utilisez-vous réellement ?","hint":"Parmi les possibilités de votre outil, celles dont vous vous servez vraiment.","options":["Voir les données sur une carte","Saisir des informations sur le terrain","Planifier / calendrier","Suivre l'avancement","Éditer et modifier les données","Exporter (Excel, PDF...)","Tableau de bord avec bilan"],"other":true,"showIf":{"q":13,"in":["Plus de 3 ans","Entre 1 an et 3 ans","Moins de 1 an","En cours d'expérimentation"]}},{"n":16,"col":"q16_satisfaction","type":"single","req":false,"label":"En êtes-vous satisfait ?","hint":"Votre satisfaction globale vis-à-vis de cet outil (de « pas du tout » à « tout à fait »).","options":["Pas du tout","Plutôt non","Plutôt oui","Tout à fait"],"showIf":{"q":13,"in":["Plus de 3 ans","Entre 1 an et 3 ans","Moins de 1 an","En cours d'expérimentation"]}},{"n":17,"col":"q17_smartphone","type":"single","req":true,"label":"Lors des chantiers d'entretien, les agents travaillent-ils avec une tablette ou un smartphone ?","options":["Toujours","Régulièrement","Parfois","Jamais"]}]},{"title":"Vos données","questions":[{"n":18,"col":"q18_forme_plan","type":"multi","req":true,"label":"Sous quelle forme se présente votre plan de gestion actuel ?","hint":"Par plan de gestion, nous entendons l'identification des zones ou tronçons avec les niveaux de service correspondants, éventuellement la date d'intervention et les ressources mobilisées. Si les formats techniques ne vous parlent pas, cochez simplement « Carte papier », « Tableau Excel » ou « Aucun plan formalisé ».","options":["Carte papier","Tableau Excel / CSV","Fichiers cartographiques numériques (shapefile, GPX, KML)","Logiciel de cartographie ou base de données (SIG type QGIS)","Aucun plan formalisé"],"other":true},{"n":19,"col":"q19_elements_cles","type":"multi","req":true,"label":"Quels éléments du bord de route sont, pour vous, incontournables à connaître pour planifier les chantiers ?","hint":"Les éléments que vous devez absolument avoir en tête pour bien préparer un chantier.","options":["Accotement","Fossé","Talus","Haies / arbres","Panneaux de signalisation","Glissières / équipements de sécurité","Pistes cyclables","Réseaux (Enedis, etc.)","Espèces invasives (ex. renouée)","Zones réglementées (Natura 2000, ZNIEFF...)","Cours d'eau","Parcelles agricoles / bio riveraines"],"other":true}]},{"title":"Vos attentes pour faciliter la planification","questions":[{"n":20,"col":"q20_format_souhaite","type":"single","req":true,"label":"Quel format d'outil serait, selon vous, le plus pratique ?","hint":"Le type d'outil qui vous conviendrait le mieux au quotidien.","options":["Application sur navigateur (ordinateur)","Application mobile / tablette pour le terrain","Tableur Excel amélioré","Logiciel cartographique (type QGIS)","Papier"],"other":true},{"n":21,"col":"q21_fonctionnalites","type":"multi","req":true,"max":3,"label":"Quelles fonctionnalités vous seraient les plus utiles ?","hint":"Cochez-en jusqu'à 3. « Découpage automatique en sections » : l'outil découpe la route en tronçons réguliers (ex. tous les 2 km) pour résumer le chantier secteur par secteur.","options":["Importer mon plan existant","Voir mes chantiers sur une carte","Être alerté des contraintes (espèces, érosion, risque incendie, réglementation, parcelles bio)","Recevoir des recommandations d'intervention","Découpage automatique en sections (ex. tous les 2 km)","Résumé / tableau de bord du chantier","Export Excel / PDF","Signalement terrain (photo)","Suivi de l'avancement"],"other":true},{"n":22,"col":"q22_infos_tableau_bord","type":"multi","req":true,"label":"Dans un résumé de chantier (tableau de bord), quelles informations voudriez-vous voir ?","hint":"Un tableau de bord = une fiche de synthèse du chantier. « Linéaire par élément » = le nombre de mètres de fossé, de talus, de haies à traiter.","options":["Linéaire par élément (fossé, talus, haies)","Surfaces à faucher / débroussailler","Espèces invasives présentes","Niveau d'érosion","Risque incendie","Parcelles bio à proximité","Obstacles / panneaux","Périodes d'intervention conseillées / réglementaires","Matériel nécessaire","Temps / durée estimés","Coût estimé"],"other":true},{"n":23,"col":"q23_difficultes_numerique","type":"multi","req":true,"label":"Qu'est-ce qui pourrait compliquer l'usage d'un outil numérique au quotidien ?","hint":"Ce qui pourrait vous empêcher ou vous décourager de l'utiliser.","options":["Manque de temps pour l'apprendre","Pas à l'aise avec l'informatique","Pas de matériel (PC / tablette)","Pas de réseau sur le terrain","Habitudes papier bien installées","Crainte que ce soit trop compliqué","Aucune difficulté particulière"],"other":true,"exclusive":"Aucune difficulté particulière"}]},{"title":"Mise en situation","questions":[{"n":24,"col":"q24_scenario_chantier","type":"textarea","req":false,"label":"Imaginez un chantier d'entretien sur un secteur que vous connaissez. Décrivez, avec vos mots, comment vous vous y prendriez pour le préparer.","hint":"Par quoi vous commencez, ce que vous regardez, ce dont vous avez besoin."},{"n":25,"col":"q25_amelioration","type":"textarea","req":false,"label":"S'il y avait UNE chose à améliorer dans votre façon de planifier aujourd'hui, ce serait :"}]},{"title":"Pour finir","questions":[{"n":26,"col":"q26_entretien","type":"single","req":true,"label":"Accepteriez-vous d'échanger un peu plus (entretien court) ou de tester une solution en avant-première ?","options":["Oui","Peut-être","Non"]},{"n":27,"col":"q26_contact","type":"text","req":false,"label":"Si oui, nom / contact (facultatif) :","sub":true,"showIf":{"q":26,"in":["Oui","Peut-être"]}}]}],"outro":"Merci pour le temps que vous nous accordez."};
const TABLE = "planification";
const $ = (s, r = document) => r.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.textContent = h; return e; };

$("#title").textContent = DATA.title;
$("#intro").innerHTML = DATA.introHtml.map(p => `<p>${p}</p>`).join("");
const form = $("#form");
const all = DATA.groups.flatMap(g => g.questions);
const byN = Object.fromEntries(all.map(q => [q.n, q]));
$("#nq").textContent = `Il y a ${all.filter(q => !q.sub).length} questions dans ce questionnaire.`;

// ---------- rendu (une page par groupe) ----------
const pages = [];
DATA.groups.forEach((g, gi) => {
  const page = el("div", "page" + (gi ? " hidden" : ""));
  const head = el("div", "card");
  head.appendChild(el("h2", "group", g.title));
  if (gi === 0) head.appendChild(el("p", "group-desc", DATA.consigne));
  page.appendChild(head);
  g.questions.forEach(q => page.appendChild(renderQ(q)));
  form.appendChild(page); pages.push({ page, g });
});

function instruction(q) {
  if (q.type === "single") return "Veuillez sélectionner une réponse ci-dessous.";
  if (q.type === "multi") return q.max ? `Veuillez sélectionner au maximum ${q.max} réponses ci-dessous.` : "Plusieurs réponses possibles — veuillez en sélectionner au moins une.";
  return "Veuillez écrire votre réponse ici :";
}

function renderQ(q) {
  const fs = el("fieldset"); fs.dataset.n = q.n;
  if (q.req) { const r = el("span", "req"); r.innerHTML = "<b>✱</b>Obligatoire"; fs.appendChild(r); }
  const lg = el("legend", null, (q.sub ? "" : q.n + ") ") + q.label);
  fs.appendChild(lg);
  if (q.hint) fs.appendChild(el("p", "hint", q.hint));
  if (q.figure) {
    const f = el("figure"); const im = document.createElement("img");
    im.src = q.figure.src; im.alt = q.figure.alt || ""; im.loading = "lazy"; im.onerror = () => f.remove();
    f.appendChild(im); if (q.figure.caption) f.appendChild(el("figcaption", null, q.figure.caption));
    fs.appendChild(f);
  }
  fs.appendChild(el("p", "instr", instruction(q)));

  if (q.type === "single" || q.type === "multi") {
    const box = el("div", "opts");
    const type = q.type === "single" ? "radio" : "checkbox";
    q.options.concat(q.other ? ["Autre"] : []).forEach(o => {
      const lab = el("label", "opt");
      const inp = document.createElement("input");
      inp.type = type; inp.name = "q" + q.n; inp.value = o;
      lab.appendChild(inp);
      if (o === "Autre") {
        const w = el("span", "other-wrap"); w.appendChild(document.createTextNode("Autre :"));
        const t = el("textarea", "other-txt"); t.maxLength = 1000; t.rows = 3; t.placeholder = "Précisez ici…"; t.setAttribute("aria-label", "Précisez");
        t.addEventListener("click", ev => { ev.stopPropagation(); inp.checked = true; inp.dispatchEvent(new Event("change", { bubbles: true })); });
        w.appendChild(t); lab.appendChild(w);
      } else lab.appendChild(el("span", null, o));
      box.appendChild(lab);
    });
    fs.appendChild(box);
  } else if (q.type === "text") {
    const t = el("input"); t.type = "text"; t.name = "q" + q.n; t.maxLength = 300; fs.appendChild(t);
  } else {
    const t = el("textarea"); t.name = "q" + q.n; t.maxLength = 3000; fs.appendChild(t);
  }
  fs.appendChild(el("p", "msg", q.type === "multi" ? "Cochez au moins une réponse." : "Merci de répondre à cette question."));
  if (q.showIf) fs.classList.add("hidden");
  return fs;
}

const hp = el("div", "hp");
hp.innerHTML = '<label>Ne pas remplir <input type="text" name="site_web" tabindex="-1" autocomplete="off"></label>';
form.appendChild(hp);

const nav = el("div", "nav");
const prev = el("button", "sec", "← Précédent"); prev.type = "button";
const next = el("button", null, "Suivant →"); next.type = "button";
const send = el("button", null, "Envoyer"); send.type = "submit";
nav.append(prev, next, send); form.appendChild(nav);
const status = el("p"); status.id = "status"; form.appendChild(status);

// ---------- lecture des valeurs ----------
const fsOf = n => form.querySelector(`fieldset[data-n="${n}"]`);
const visible = q => !fsOf(q.n).classList.contains("hidden");
const otherTxt = q => fsOf(q.n).querySelector(".other-txt");

function getVal(q) {
  const fs = fsOf(q.n);
  if (q.type === "single") { const c = fs.querySelector("input:checked"); return c ? c.value : null; }
  if (q.type === "multi") return [...fs.querySelectorAll("input:checked")].map(i => i.value);
  const v = fs.querySelector("input,textarea").value.trim(); return v || null;
}
const answered = q => { const v = getVal(q); return Array.isArray(v) ? v.length > 0 : v !== null; };

// ---------- interactions ----------
form.addEventListener("change", e => {
  const fs = e.target.closest("fieldset"); if (!fs || e.target.classList.contains("other-txt")) return;
  const q = byN[fs.dataset.n];

  if (q.exclusive && e.target.type === "checkbox") {
    const boxes = [...fs.querySelectorAll("input[type=checkbox]")];
    if (e.target.value === q.exclusive && e.target.checked) boxes.forEach(b => { if (b !== e.target) b.checked = false; });
    else if (e.target.checked) boxes.find(b => b.value === q.exclusive).checked = false;
  }
  if (q.other) {
    const o = fs.querySelector('input[value="Autre"]'), t = otherTxt(q);
    if (!o.checked) t.value = ""; else if (e.target === o) t.focus();
  }
  if (q.max) {
    const boxes = [...fs.querySelectorAll("input[type=checkbox]")];
    const n = boxes.filter(b => b.checked).length;
    boxes.forEach(b => b.disabled = !b.checked && n >= q.max);
  }
  all.filter(x => x.showIf && x.showIf.q === q.n).forEach(x => {
    const show = x.showIf.in.includes(getVal(q));
    const f = fsOf(x.n); f.classList.toggle("hidden", !show);
    if (!show) f.querySelectorAll("input,textarea").forEach(i => { i.checked = false; if (i.type === "text" || i.tagName === "TEXTAREA") i.value = ""; });
  });
  fs.classList.remove("err");
  progress();
});
form.addEventListener("input", e => { const fs = e.target.closest("fieldset"); if (fs) fs.classList.remove("err"); });

// ---------- pages ----------
let cur = 0;
function show(i) {
  cur = i;
  pages.forEach((p, k) => p.page.classList.toggle("hidden", k !== i));
  prev.classList.toggle("hidden", i === 0);
  next.classList.toggle("hidden", i === pages.length - 1);
  send.classList.toggle("hidden", i !== pages.length - 1);
  status.textContent = "";
  progress();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function pageQs(i) { return pages[i].g.questions; }
function validate(qs) {
  let first = null;
  qs.forEach(q => {
    const f = fsOf(q.n); f.classList.remove("err");
    if (q.req && visible(q) && !answered(q)) { f.classList.add("err"); first = first || f; }
  });
  if (first) { first.scrollIntoView({ behavior: "smooth", block: "center" }); status.textContent = "Il reste des questions obligatoires sur cette page."; return false; }
  status.textContent = ""; return true;
}
prev.onclick = () => show(cur - 1);
next.onclick = () => { if (validate(pageQs(cur))) show(cur + 1); };

function progress() {
  $("#fill").style.width = (100 * (cur + 1) / pages.length) + "%";
  $("#count").textContent = `Page ${cur + 1} / ${pages.length}`;
}
show(0);

// ---------- envoi ----------
form.addEventListener("submit", async e => {
  e.preventDefault(); status.textContent = "";
  for (let i = 0; i < pages.length; i++) {
    if (!validate(pageQs(i))) { if (i !== cur) { show(i); validate(pageQs(i)); } return; }
  }
  if (form.elements.site_web.value) return done();

  const row = {};
  all.forEach(q => {
    const shown = visible(q);
    let v = shown ? getVal(q) : null;
    if (q.type === "multi" && !q.req && Array.isArray(v) && !v.length) v = null;
    row[q.col] = v;
    if (q.other) {
      const t = otherTxt(q).value.trim();
      const hasOther = shown && (Array.isArray(v) ? v.includes("Autre") : v === "Autre");
      row[q.col + "_autre"] = hasOther && t ? t : null;
    }
  });

  if (!window.SUPABASE_URL || /VOTRE/.test(window.SUPABASE_URL + window.SUPABASE_ANON_KEY)) {
    status.textContent = "Configuration manquante : renseignez config.js (URL et clé anon Supabase)."; return;
  }
  send.disabled = true; send.textContent = "Envoi…";
  try {
    const r = await fetch(`${window.SUPABASE_URL}/rest/v1/${TABLE}`, {
      method: "POST",
      headers: Object.assign(
        { "Content-Type": "application/json", apikey: window.SUPABASE_ANON_KEY, Prefer: "return=minimal" },
        window.SUPABASE_ANON_KEY.startsWith("eyJ") ? { Authorization: "Bearer " + window.SUPABASE_ANON_KEY } : {}
      ),
      body: JSON.stringify(row)
    });
    if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 200));
    done();
  } catch (err) {
    console.error(err);
    status.textContent = "L'envoi a échoué. Vérifiez votre connexion et réessayez : vos réponses sont conservées sur cette page.";
    send.disabled = false; send.textContent = "Envoyer";
  }
});

function done() {
  $("#app").innerHTML = '<div class="card thanks"><h2>Merci !</h2><p>Vos réponses ont bien été enregistrées. ' + "Merci pour le temps que vous nous accordez.</p></div>";
  $("#fill").style.width = "100%"; $("#count").textContent = "Terminé";
  window.scrollTo({ top: 0 });
}
</script>
</body>
</html>
